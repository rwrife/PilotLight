name: Build PilotLight

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore /p:RuntimeIdentifiers="win-x64;win-arm64"

      - name: Publish (x64)
        run: dotnet publish PilotLight.Avalonia/PilotLight.Avalonia.csproj -c Release -r win-x64 --self-contained false -o artifacts/win-x64 --no-restore

      - name: Publish (ARM64)
        run: dotnet publish PilotLight.Avalonia/PilotLight.Avalonia.csproj -c Release -r win-arm64 --self-contained false -o artifacts/win-arm64 --no-restore

      - name: Upload artifacts (x64)
        uses: actions/upload-artifact@v4
        with:
          name: PilotLight-win-x64
          path: artifacts/win-x64/**

      - name: Upload artifacts (arm64)
        uses: actions/upload-artifact@v4
        with:
          name: PilotLight-win-arm64
          path: artifacts/win-arm64/**
