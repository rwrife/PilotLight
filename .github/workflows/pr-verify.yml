name: PR Build and Windows Verification

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - 'cron/**'
  workflow_dispatch: {}

jobs:
  build-and-package:
    name: Build Release and Publish Artifacts
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore /p:RuntimeIdentifiers="win-x64;win-arm64"

      - name: Build (x64)
        run: dotnet build /p:Configuration=Release /p:RuntimeIdentifier=win-x64 --no-restore

      - name: Build (ARM64)
        run: dotnet build /p:Configuration=Release /p:RuntimeIdentifier=win-arm64 --no-restore

      - name: Publish (x64)
        run: dotnet publish /p:Configuration=Release /p:RuntimeIdentifier=win-x64 --self-contained false -o artifacts/win-x64

      - name: Publish (ARM64)
        run: dotnet publish /p:Configuration=Release /p:RuntimeIdentifier=win-arm64 --self-contained false -o artifacts/win-arm64

      - name: Upload x64 artifact
        uses: actions/upload-artifact@v4
        with:
          name: PilotLight-win-x64
          path: artifacts/win-x64/**

      - name: Upload ARM64 artifact
        uses: actions/upload-artifact@v4
        with:
          name: PilotLight-win-arm64
          path: artifacts/win-arm64/**
